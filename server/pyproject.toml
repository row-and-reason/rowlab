[project]
name = "rowlab"
version = "0.1.0"
description = "AI labeling, filtering and analysis for tabular data"
authors = [
    { name = "Ekku Leivonen", email = "ekku.leivonen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.162.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
# For hosted setups: Postgres (`ROWLAB_DATABASE_URL`), datasets on S3 (`ROWLAB_STORAGE_URL`) and
# sign-in with WorkOS.
hosted = [
    "boto3>=1.40",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.10",
    "workos>=10.8.0",
]

[project.scripts]
rowlab = "rowlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "moto[server]>=5.2.5",
    # So the tests can run on Postgres and S3 too (see tests/conftest.py).
    "rowlab[hosted]",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build]
# The bundled web UI is gitignored but must ship in the wheel.
artifacts = ["src/rowlab/static/**"]
