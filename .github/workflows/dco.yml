# Every commit in a pull request is signed off (`git commit -s`); see CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git show -s --format='%h %s' "$commit") is not signed off."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with \`git rebase --signoff $BASE\` and force-push; see CONTRIBUTING.md."
            exit 1
          fi
