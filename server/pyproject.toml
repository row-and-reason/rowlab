[project]
name = "rowlab"
version = "0.1.0"
description = "AI labeling, filtering and analysis for tabular data"
authors = [
    { name = "Ekku Leivonen", email = "ekku.leivonen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
rowlab = "rowlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build]
# The bundled web UI is gitignored but must ship in the wheel.
artifacts = ["src/rowlab/static/**"]
