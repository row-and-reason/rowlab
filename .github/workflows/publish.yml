# Build both images and push them to GitHub's registry: on main as `main` and `sha-…`, on a release
# tag `v1.2.3` as `1.2.3` and `latest`, and publish that release to PyPI.
#   ghcr.io/row-and-reason/rowlab        the app (Dockerfile)
#   ghcr.io/row-and-reason/rowlab-site   rowlab.dev and docs.rowlab.dev (site/Dockerfile)
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: rowlab
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: rowlab-site
            file: site/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/row-and-reason/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The sites' PostHog token is public by design; see site/README.md.
          build-args: |
            PUBLIC_POSTHOG_TOKEN=phc_pUVWTmhSNyyuAFHec6mhqYVT6u5CaeCKGstjqpzmchxe
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # A release tag also publishes the package to PyPI, with the web UI built into the wheel, so
  # `uvx rowlab` works. PyPI trusts this workflow in the `pypi` environment; no token is stored.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: The tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(cd server && uv version --short)"
      - run: cd web && pnpm install --frozen-lockfile && pnpm build
      - run: cp -r web/out server/src/rowlab/static && cd server && uv build --out-dir ../dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
