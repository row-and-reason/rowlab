worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    # Redirects (a docs path without its slash) keep the public origin, not nginx's host and port.
    absolute_redirect off;

    # Writable paths, so the image runs as any user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Cloudflare re-encodes at the edge; this covers serving without it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # rowlab.dev, and any other host (stg.rowlab.dev on staging): Astro writes pages as files
    # (pricing.html).
    server {
        listen 8080 default_server;
        server_name rowlab.dev;
        root /usr/share/nginx/html/www;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location /_astro/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
            add_header Cache-Control 'public, max-age=300';
        }
    }

    server {
        listen 8080;
        server_name www.rowlab.dev;
        return 301 https://rowlab.dev$request_uri;
    }

    # docs.rowlab.dev, and stg-docs.rowlab.dev on staging: Starlight writes pages as folders
    # (get-started/index.html).
    server {
        listen 8080;
        server_name docs.rowlab.dev stg-docs.rowlab.dev;
        root /usr/share/nginx/html/docs;
        index index.html;
        error_page 404 /404.html;

        location /_astro/ {
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control 'public, max-age=300';
        }
    }
}
