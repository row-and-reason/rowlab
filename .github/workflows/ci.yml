# Lint, test and build on every push and pull request. The S3 tests run against a local S3 server
# (moto) that the tests start themselves, so no storage service is needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd server && uv sync --locked
      - run: make lint test build
      # The API and the generated client must match: `make build` regenerates them.
      - run: git diff --exit-code -- openapi.json web/src/lib/api/schema.ts
