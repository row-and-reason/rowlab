# Build both images and push them to GitHub's registry: on main as `main` and `sha-…`, on a release
# tag `v1.2.3` as `1.2.3` and `latest`.
#   ghcr.io/row-and-reason/rowlab        the app (Dockerfile)
#   ghcr.io/row-and-reason/rowlab-site   rowlab.dev and docs.rowlab.dev (site/Dockerfile)
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: rowlab
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: rowlab-site
            file: site/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/row-and-reason/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The sites' PostHog token is public by design; see site/README.md.
          build-args: |
            PUBLIC_POSTHOG_TOKEN=phc_pUVWTmhSNyyuAFHec6mhqYVT6u5CaeCKGstjqpzmchxe
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
