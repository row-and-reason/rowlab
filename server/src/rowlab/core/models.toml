# rowlab's own list of models: our opinion, offered first. Any other decision model, or LLM with
# structured outputs, in OpenRouter's catalog can be asked too, by id; this list is what we'd pick.
# Order matters: the picker and `models_list` show them in this order within each kind, so put the
# ones we'd pick first.
#
# - id: OpenRouter's model id. An id names one snapshot (`deepseek/deepseek-v4.1-flash` is an older
#   model than `deepseek/deepseek-v4.1-flash-1017`); check `canonical_slug` in OpenRouter's catalog.
# - kind: `decision` (OpenRouter's Decisions API; Classify only) or `llm` (chat with structured outputs).
# - tags: `recommended` puts it in the picker's Recommended group; others (`budget`, `accurate`) are
#   for filtering.
# - price_in / price_out: USD per million tokens, used only when OpenRouter's live prices can't be
#   fetched. Decision models bill input only.

