# Lint, test and build on every push and pull request. The tests run twice: on the local setup (SQLite,
# datasets on disk) and on the hosted one (Postgres, datasets on S3). S3 is a local server (moto) that
# the tests start themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd server && uv sync --locked
      - run: make lint test build
      # End to end against the wheel just built. CI has no OPENROUTER_API_KEY, so the smoke test skips
      # asking a model; that part runs only locally.
      - run: scripts/smoke-wheel.sh
      - run: make test-hosted
        env:
          ROWLAB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The API and the generated client must match: `make build` regenerates them.
      - run: git diff --exit-code -- openapi.json web/src/lib/api/schema.ts
      # The docs build the API reference from openapi.json, so build them too.
      - run: cd site/docs && pnpm install --frozen-lockfile && pnpm build
