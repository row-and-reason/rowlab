[project]
name = "rowlab-python-sdk"
version = "0.1.0"
description = "Typed Python client for the rowlab API: label, compare and export tabular data from code"
authors = [
    { name = "Row & Reason", email = "support@rowandreason.com" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
polars = ["polars>=1"]
notebook = ["marimo>=0.24", "polars>=1"]

[project.urls]
Homepage = "https://rowlab.dev"
Documentation = "https://docs.rowlab.dev/agents/python/"
Source = "https://github.com/row-and-reason/rowlab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is `rowlab-python-sdk`, the package `rowlab_sdk`.
packages = ["src/rowlab_sdk"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.96.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Generated from openapi.json by `make gen-client`.
extend-exclude = ["src/rowlab_sdk/_models.py"]
